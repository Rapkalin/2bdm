name: Deploy 2bdm website on push new tag

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: [ 8.2 ]

    steps:
      - name: checkout 2bdm project
        uses: actions/checkout@v4

      - name: Restore the Composer cache directory
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: /tmp/composer-cache
          key: ${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-'8.0'-composer-

      - name: Install dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          progress: yes
          args: --prefer-dist --no-interaction
          php_version: 8.2

      - name: Setup Node version
        uses: actions/setup-node@v2
        with:
          node-version: 20

      - name: Install node_modules
        run: |
          cd website/app/themes/2bdm/
          npm install

      - name: Build webpack
        run: |
          cd website/app/themes/2bdm/
          npx webpack --optimization-minimize

      - name: Zip artifact for deployment
        run: zip -r release-${{ matrix.runs-on }}.zip website/app/* website/vendor/* website/wordpress-core/* -x ".git/*" -x ".github/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.runs-on }}
          path: release-${{ matrix.runs-on }}.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: create or replace backup release
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: "[ ! -d ~/prod/website ] || rm -rf ~/prod/old_website ~/prod/website/vendor ~/prod/website/wordpress-core && mv -fu ~/prod/website ~/prod/old_website"

      - name: checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true

      - name: unzip artifact for deployment
        run: |
         unzip -o release-${{ matrix.runs-on }}.zip

      - name: Deploy with rsync
        uses: burnett01/rsync-deployments@5.2
        with:
          switches: -avzr --delete
          path: ./website
          remote_path: ~/prod
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      - name: create new Symlink
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 22
          script: |
            ln -nsrf ~/prod/shared/.env ~/prod/website/.env
            ln -nsrf ~/prod/shared/uploads ~/prod/website/app/uploads
            ln -nsrf ~/prod/shared/cache ~/prod/website/app/cache
            ln -nsrf ~/prod/shared/w3tc-config ~/prod/website/app/w3tc-config
            ln -nsrf ~/prod/shared/uploads-webpc ~/prod/website/app/uploads-webpc
            rm ~/prod/website/.htaccess
            rm ~/prod/website/.htaccess
            ln -nsrf ~/prod/shared/.htaccess ~/prod/website/.htaccess

      # Inventaire Watcha : envoie composer.lock à la veille CVE.
      # Guide complet (variables à créer, cas WordPress, refus) : /documentation
      # sur l'instance Watcha. WordPress est ici géré par Composer, donc le lock
      # suffit — il porte le cœur et les extensions wpackagist.
      - name: Signaler l'inventaire à Watcha
        # Le déploiement a réussi : une veille injoignable ne doit pas le marquer en échec.
        continue-on-error: true
        env:
          WATCHA_TOKEN: ${{ secrets.WATCHA_TOKEN }}
          WATCHA_URL: ${{ vars.WATCHA_URL || secrets.WATCHA_URL }}
        run: |
          # Guide d'installation : <WATCHA_URL>/documentation
          [ -n "$WATCHA_TOKEN" ] && [ -n "$WATCHA_URL" ] || { echo "Watcha non configuré : envoi ignoré."; exit 0; }
          [ -s composer.lock ] || { echo "composer.lock absent : rien à envoyer."; exit 0; }
          while [ "${WATCHA_URL%/}" != "$WATCHA_URL" ]; do WATCHA_URL="${WATCHA_URL%/}"; done

          body=$(mktemp); trace=$(mktemp)
          # --http1.1 et « Expect: » vidé : sans eux, un proxy peut faire perdre le corps.
          result=$(curl -sS --http1.1 -H "Expect:" -v -o "$body" -w '%{http_code} %{size_upload}' \
            -X POST "$WATCHA_URL/api/inventory" \
            -H "X-Watcha-Token: $WATCHA_TOKEN" \
            -F "lock=@composer.lock" 2>"$trace") || result="000 0"
          code=${result%% *}; sent=${result##* }   # expansion et non « set -- » : zsh diffère

          if [ "$code" = "200" ]; then cat "$body"; echo; exit 0; fi

          # Watcha explique lui-même chaque refus dans sa réponse : on n'ajoute ici que
          # ce qu'un serveur ne peut pas savoir.
          echo "Envoi de l'inventaire refusé (HTTP $code) :"
          head -c 500 "$body"; echo
          echo "→ composer.lock : $(wc -c < composer.lock) octets ; émis par curl : $sent."
          if [ "$code" = "000" ]; then
            echo "→ Aucune réponse : vérifiez WATCHA_URL et le réseau."
          elif head -c 200 "$body" | grep -qi '<html\|<!doctype'; then
            echo "→ Réponse HTML : le SERVEUR WEB a refusé, Watcha n'a rien vu."
          fi
          sed -E 's/(X-Watcha-Token:).*/\1 ***/I' "$trace" | grep -E '^[*<>]' \
            | grep -vE '^\* (TLSv|SSL|ALPN|Server certificate|  )' | head -30
